<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 85" width="100%" height="100%">
  <!-- Giant Ghost Background Outline Text (Seamlessly floating) -->
  <text x="10" y="66" fill="none" stroke="rgba(242,240,235,0.07)" stroke-width="2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Impact, sans-serif" font-size="78" font-weight="900" letter-spacing="4">ARCADE</text>

  <!-- Foreground Content -->
  <g transform="translate(10, 16)">
    <!-- Index Tag -->
    <text x="0" y="16" fill="#FF3B30" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="bold" letter-spacing="2">02 // ARCADE</text>
    
    <!-- Title -->
    <text x="0" y="44" fill="#F2F0EB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="900" letter-spacing="1.5">CONTRIBUTION ARCADE</text>
    
    <!-- Accent Line -->
    <rect x="0" y="54" width="60" height="3" fill="#FF3B30" rx="1.5" />
  </g>
</svg>