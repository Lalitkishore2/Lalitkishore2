<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 320" width="100%" height="100%">
  <defs>
    <clipPath id="sc_card-aquadot-light.svg">
      <rect width="260" height="320" rx="8" ry="8" />
    </clipPath>
  </defs>

  <g clip-path="url(#sc_card-aquadot-light.svg)">
    <rect width="260" height="320" fill="#FFFFFF" />

    <!-- Top Accent Bar -->
    <rect x="0" y="0" width="260" height="4" fill="#5A7800" />

    <!-- Index & Status -->
    <text x="18" y="32" fill="#5A7800" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" letter-spacing="1.5">01/</text>
    <rect x="156" y="18" width="86" height="18" rx="3" fill="#5A7800" />
    <text x="199" y="31" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" text-anchor="middle">LIVE</text>

    <!-- Title -->
    <text x="18" y="66" fill="#0A0A0A" font-family="-apple-system, sans-serif" font-weight="900" font-size="16" letter-spacing="0.5">AQUADOT</text>

    <!-- Description Lines -->
    <text x="18" y="92" fill="#6B6B68" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="500">Autonomous aquaculture water</text>
    <text x="18" y="112" fill="#6B6B68" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="500">monitoring and edge AI control.</text>

    <!-- Metric Box -->
    <rect x="18" y="145" width="224" height="44" rx="4" fill="#F5F4F0" stroke="#D0D0D0" stroke-width="1" />
    <text x="28" y="163" fill="#5A7800" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" letter-spacing="0.5">METRIC TARGET</text>
    <text x="28" y="180" fill="#0A0A0A" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600">Alerts &lt;30s | ~70% drop</text>

    <!-- Tech Tags -->
    <g transform="translate(18, 208)">
      <rect x="0" y="0" width="65" height="22" rx="3" fill="#ECEAE5" stroke="#D0D0D0" stroke-width="1" />
      <text x="32" y="15" fill="#0A0A0A" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle">RPi4B</text>
      
      <rect x="72" y="0" width="75" height="22" rx="3" fill="#ECEAE5" stroke="#D0D0D0" stroke-width="1" />
      <text x="109" y="15" fill="#0A0A0A" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle">YOLO11n</text>
    </g>

    <!-- Button -->
    <rect x="18" y="255" width="224" height="38" rx="4" fill="#5A7800" />
    <text x="130" y="279" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="bold" text-anchor="middle">CASE STUDY &#x2197;</text>
  </g>

  <!-- Border -->
  <rect width="260" height="320" rx="8" ry="8" fill="none" stroke="#5A7800" stroke-width="1.5" />
</svg>