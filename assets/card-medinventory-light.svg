<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 210" width="100%" height="100%">
  <defs>
    <clipPath id="cardClip">
      <rect width="540" height="210" rx="8" ry="8" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="540" height="210" fill="#F5F4F0" />

    <!-- Top Header -->
    <text x="24" y="38" fill="#FF3B30" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="14">03 // </text>
    <text x="80" y="38" fill="#0A0A0A" font-family="-apple-system, sans-serif" font-weight="800" font-size="17" letter-spacing="1">MED INVENTORY</text>

    <!-- Badge -->
    <rect x="420" y="20" width="96" height="22" rx="4" fill="#FF3B30" />
    <text x="468" y="35" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">CASE STUDY &#x2197;</text>

    <!-- Description -->
    <text x="24" y="78" fill="#0A0A0A" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="600">Computer Vision Medical Logistics &amp; Stock Tracker</text>
    <text x="24" y="104" fill="#6B6B68" font-family="-apple-system, sans-serif" font-size="12">Automated camera/OCR expiry classification &amp; multi-channel SMS alerts.</text>

    <!-- Tags -->
    <g transform="translate(24, 152)">
      <rect x="0" y="0" width="80" height="24" rx="4" fill="#ECEAE5" stroke="#D0D0D0" stroke-width="1" />
      <text x="40" y="16" fill="#0A0A0A" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">OpenCV</text>
      
      <rect x="90" y="0" width="105" height="24" rx="4" fill="#ECEAE5" stroke="#D0D0D0" stroke-width="1" />
      <text x="142" y="16" fill="#0A0A0A" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Tesseract</text>
      
      <rect x="205" y="0" width="90" height="24" rx="4" fill="#ECEAE5" stroke="#D0D0D0" stroke-width="1" />
      <text x="250" y="16" fill="#0A0A0A" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Python</text>
    </g>
  </g>

  <!-- Outer Border with Accent -->
  <rect width="540" height="210" rx="8" ry="8" fill="none" stroke="#FF3B30" stroke-width="1.5" />
</svg>