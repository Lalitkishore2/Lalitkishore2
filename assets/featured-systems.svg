        <text x="100" y="16" fill="#9ccfd8" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">Hardware</text>
        <rect x="150" y="0" width="85" height="24" rx="4" fill="#161b22" stroke="#30363d" />
        <text x="192" y="16" fill="#9ccfd8" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">Telemetry</text>
      </g>
