      <g transform="translate(24, 150)">
        <rect x="0" y="0" width="65" height="24" rx="4" fill="#161b22" stroke="#30363d" />
        <text x="32" y="16" fill="#9ccfd8" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">Python</text>
        <rect x="75" y="0" width="70" height="24" rx="4" fill="#161b22" stroke="#30363d" />
        <text x="110" y="16" fill="#9ccfd8" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">OpenCV</text>
        <rect x="155" y="0" width="55" height="24" rx="4" fill="#161b22" stroke="#30363d" />
        <text x="182" y="16" fill="#9ccfd8" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">YOLO</text>
