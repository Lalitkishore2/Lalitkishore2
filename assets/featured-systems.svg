<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="100%">
  <defs>
    <clipPath id="cardRadius">
      <rect width="1100" height="480" rx="10" ry="10" />
    </clipPath>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12161f" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <g clip-path="url(#cardRadius)">
    <rect width="1100" height="480" fill="#0b0d12" />

    <!-- 01 AQUADOT -->
    <g transform="translate(20, 20)">
      <rect width="520" height="210" rx="8" fill="url(#cardGrad)" stroke="#238636" stroke-width="1.5" />
      <text x="24" y="38" fill="#238636" font-family="'Fira Code', monospace" font-weight="bold" font-size="14">01 // </text>
      <text x="75" y="38" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="800" font-size="18" letter-spacing="1">AQUADOT</text>
      <rect x="420" y="20" width="80" height="22" rx="4" fill="#238636" />
      <text x="460" y="35" fill="#ffffff" font-family="'Fira Code', monospace" font-size="10" font-weight="bold" text-anchor="middle">ACTIVE â†—</text>

      <text x="24" y="78" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="500">Autonomous Aquaculture Monitoring &amp; Control</text>
      <text x="24" y="102" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="12">Continuous water quality telemetry, automated aeration &amp; cloud logging.</text>

      <!-- Tags -->
      <g transform="translate(24, 150)">
        <rect x="0" y="0" width="60" height="24" rx="4" fill="#161b22" stroke="#30363d" />
        <text x="30" y="16" fill="#9ccfd8" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">ESP32</text>
        <rect x="70" y="0" width="95" height="24" rx="4" fill="#161b22" stroke="#30363d" />
        <text x="117" y="16" fill="#9ccfd8" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">Embedded C</text>
        <rect x="175" y="0" width="70" height="24" rx="4" fill="#161b22" stroke="#30363d" />
        <text x="210" y="16" fill="#9ccfd8" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">Sensors</text>
      </g>
    </g>

    <!-- 02 SMARTFLOW IV -->
    <g transform="translate(560, 20)">
      <rect width="520" height="210" rx="8" fill="url(#cardGrad)" stroke="#d29922" stroke-width="1.5" />
      <text x="24" y="38" fill="#d29922" font-family="'Fira Code', monospace" font-weight="bold" font-size="14">02 // </text>
      <text x="75" y="38" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="800" font-size="18" letter-spacing="1">SMARTFLOW IV</text>
      <rect x="420" y="20" width="80" height="22" rx="4" fill="#d29922" />
      <text x="460" y="35" fill="#0d1117" font-family="'Fira Code', monospace" font-size="10" font-weight="bold" text-anchor="middle">HEALTH â†—</text>

      <text x="24" y="78" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="500">Intelligent Intravenous Fluid Rate &amp; Level Monitor</text>
      <text x="24" y="102" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="12">Real-time droplet measurement, wireless occlusion detection &amp; nurse alerts.</text>

      <!-- Tags -->
      <g transform="translate(24, 150)">
