      <text x="460" y="35" fill="#ffffff" font-family="'Fira Code', monospace" font-size="10" font-weight="bold" text-anchor="middle">WEB APP â†—</text>

      <text x="24" y="78" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="500">Full-Stack Inventory &amp; Order Forecast Analytics</text>
