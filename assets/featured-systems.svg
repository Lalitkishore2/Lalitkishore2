      <!-- Tags -->
      <g transform="translate(24, 150)">
        <rect x="0" y="0" width="85" height="24" rx="4" fill="#161b22" stroke="#30363d" />
        <text x="42" y="16" fill="#9ccfd8" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">TypeScript</text>
        <rect x="95" y="0" width="85" height="24" rx="4" fill="#161b22" stroke="#30363d" />
        <text x="137" y="16" fill="#9ccfd8" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">Full-Stack</text>
