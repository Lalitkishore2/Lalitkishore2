    <!-- 03 MED INVENTORY -->
    <g transform="translate(20, 250)">
      <rect width="520" height="210" rx="8" fill="url(#cardGrad)" stroke="#58a6ff" stroke-width="1.5" />
      <text x="24" y="38" fill="#58a6ff" font-family="'Fira Code', monospace" font-weight="bold" font-size="14">03 // </text>
      <text x="75" y="38" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="800" font-size="18" letter-spacing="1">MED INVENTORY</text>
