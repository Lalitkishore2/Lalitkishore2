    <!-- 04 BURFI STOCK -->
    <g transform="translate(560, 250)">
      <rect width="520" height="210" rx="8" fill="url(#cardGrad)" stroke="#E03E3E" stroke-width="1.5" />
      <text x="24" y="38" fill="#E03E3E" font-family="'Fira Code', monospace" font-weight="bold" font-size="14">04 // </text>
      <text x="75" y="38" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="800" font-size="18" letter-spacing="1">BURFI STOCK</text>
