<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 210" width="100%" height="100%">
  <defs>
    <clipPath id="cardClip">
      <rect width="540" height="210" rx="8" ry="8" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="540" height="210" fill="#0A0A0A" />

    <!-- Top Header -->
    <text x="24" y="38" fill="#d29922" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="14">04 // </text>
    <text x="80" y="38" fill="#F2F0EB" font-family="-apple-system, sans-serif" font-weight="800" font-size="17" letter-spacing="1">BURFI STOCK</text>

    <!-- Badge -->
    <rect x="420" y="20" width="96" height="22" rx="4" fill="#d29922" />
    <text x="468" y="35" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">CASE STUDY &#x2197;</text>

    <!-- Description -->
    <text x="24" y="78" fill="#F2F0EB" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="600">Full-Stack Inventory &amp; Order Forecast Analytics</text>
    <text x="24" y="104" fill="#888880" font-family="-apple-system, sans-serif" font-size="12">Real-time production ledger, automated order tracking &amp; live dashboards.</text>

    <!-- Tags -->
    <g transform="translate(24, 152)">
      <rect x="0" y="0" width="80" height="24" rx="4" fill="#161b22" stroke="#333333" stroke-width="1" />
      <text x="40" y="16" fill="#F2F0EB" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Node.js</text>
      
      <rect x="90" y="0" width="105" height="24" rx="4" fill="#161b22" stroke="#333333" stroke-width="1" />
      <text x="142" y="16" fill="#F2F0EB" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Full-Stack</text>
      
      <rect x="205" y="0" width="90" height="24" rx="4" fill="#161b22" stroke="#333333" stroke-width="1" />
      <text x="250" y="16" fill="#F2F0EB" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Analytics</text>
    </g>
  </g>

  <!-- Outer Border with Accent -->
  <rect width="540" height="210" rx="8" ry="8" fill="none" stroke="#d29922" stroke-width="1.5" />
</svg>