<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 320" width="100%" height="100%">
  <defs>
    <clipPath id="sc_card-burfistock-dark.svg">
      <rect width="260" height="320" rx="8" ry="8" />
    </clipPath>
  </defs>

  <g clip-path="url(#sc_card-burfistock-dark.svg)">
    <rect width="260" height="320" fill="#161b22" />

    <!-- Top Accent Bar -->
    <rect x="0" y="0" width="260" height="4" fill="#d29922" />

    <!-- Index & Status -->
    <text x="18" y="32" fill="#d29922" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" letter-spacing="1.5">04/</text>
    <rect x="156" y="18" width="86" height="18" rx="3" fill="#d29922" />
    <text x="199" y="31" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" text-anchor="middle">LIVE</text>

    <!-- Title -->
    <text x="18" y="66" fill="#F2F0EB" font-family="-apple-system, sans-serif" font-weight="900" font-size="16" letter-spacing="0.5">BURFI STOCK</text>

    <!-- Description Lines -->
    <text x="18" y="92" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="500">Full-stack inventory manager</text>
    <text x="18" y="112" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="500">deployed and in daily usage.</text>

    <!-- Metric Box -->
    <rect x="18" y="145" width="224" height="44" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <text x="28" y="163" fill="#d29922" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" letter-spacing="0.5">METRIC TARGET</text>
    <text x="28" y="180" fill="#F2F0EB" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600">Live production ledger</text>

    <!-- Tech Tags -->
    <g transform="translate(18, 208)">
      <rect x="0" y="0" width="65" height="22" rx="3" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="32" y="15" fill="#F2F0EB" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle">Node.js</text>
      
      <rect x="72" y="0" width="75" height="22" rx="3" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="109" y="15" fill="#F2F0EB" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle">Full-Stack</text>
    </g>

    <!-- Button -->
    <rect x="18" y="255" width="224" height="38" rx="4" fill="#d29922" />
    <text x="130" y="279" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="bold" text-anchor="middle">CASE STUDY &#x2197;</text>
  </g>

  <!-- Border -->
  <rect width="260" height="320" rx="8" ry="8" fill="none" stroke="#d29922" stroke-width="1.5" />
</svg>