name: Notify Profile README Sync

on:
  push:
    branches:
      - main

jobs:
  notify-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Profile README Live Preview Sync
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.PROFILE_SYNC_TOKEN }}" \
            https://api.github.com/repos/Lalitkishore2/Lalitkishore2/dispatches \
            -d '{"event_type":"portfolio_updated"}'
