name: Generate streak stats

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate dark streak-stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=rose_pine&stroke=FF3B30&ring=FF3B30&fire=FF3B30&currStreakLabel=FF3B30&background=161b22&border=30363d&hide_border=false&border_radius=8
          path: dist/streak-dark.svg
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate light streak-stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=rose_pine&stroke=FF3B30&ring=FF3B30&fire=FF3B30&currStreakLabel=FF3B30&background=FFFFFF&border=D0D0D0&dates=0A0A0A&currStreakNum=0A0A0A&sideNums=0A0A0A&sideLabels=6B6B68&hide_border=false&border_radius=8
          path: dist/streak-light.svg
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Push streak SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: streak-stats-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
